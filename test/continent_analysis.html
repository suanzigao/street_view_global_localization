<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS点位大洲分布分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.8; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; padding: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center; }
        .stat-card .value { font-size: 42px; font-weight: bold; }
        .stat-card .label { font-size: 14px; opacity: 0.9; margin-top: 5px; }
        .chart-container { padding: 30px; }
        .chart-wrapper { height: 400px; }
        .table-section { padding: 0 30px 30px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        tr:hover { background: #f8f9fa; }
        .progress-bar { height: 20px; background: #e9ecef; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        .europe { background: linear-gradient(90deg, #3498db, #2980b9); }
        .asia { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 GPS点位大洲分布分析</h1>
            <p>数据集: geochain_mini_test.csv | 总点位: 2099 个</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="value">1209</div>
                <div class="label">欧洲点位</div>
            </div>
            <div class="stat-card">
                <div class="value">206</div>
                <div class="label">亚洲点位</div>
            </div>
            <div class="stat-card">
                <div class="value">445</div>
                <div class="label">北美洲点位</div>
            </div>
            <div class="stat-card">
                <div class="value">117</div>
                <div class="label">南美洲点位</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2 style="text-align: center; margin-bottom: 20px; color: #333;">大洲分布比例</h2>
            <div class="chart-wrapper">
                <canvas id="continentChart"></canvas>
            </div>
        </div>
        
        <div class="table-section">
            <h2 style="margin-bottom: 15px; color: #333;">详细统计</h2>
            <table>
                <tr>
                    <th>大洲</th>
                    <th>数量</th>
                    <th>占比</th>
                    <th>进度条</th>
                </tr>
                <tr>
                    <td>欧洲</td>
                    <td>1209</td>
                    <td>57.6%</td>
                    <td><div class="progress-bar"><div class="progress-fill europe" style="width: 57.59885659838018%"></div></div></td>
                </tr>
                <tr>
                    <td>亚洲</td>
                    <td>206</td>
                    <td>9.8%</td>
                    <td><div class="progress-bar"><div class="progress-fill asia" style="width: 9.81419723677942%"></div></div></td>
                </tr>
                <tr>
                    <td>北美洲</td>
                    <td>445</td>
                    <td>21.2%</td>
                    <td><div class="progress-bar"><div class="progress-fill" style="width: 21.2%; background: linear-gradient(90deg, #2ecc71, #27ae60);"></div></div></td>
                </tr>
                <tr>
                    <td>南美洲</td>
                    <td>117</td>
                    <td>5.6%</td>
                    <td><div class="progress-bar"><div class="progress-fill" style="width: 5.6%; background: linear-gradient(90deg, #f39c12, #e67e22);"></div></div></td>
                </tr>
                <tr>
                    <td>大洋洲</td>
                    <td>120</td>
                    <td>5.7%</td>
                    <td><div class="progress-bar"><div class="progress-fill" style="width: 5.7%; background: linear-gradient(90deg, #9b59b6, #8e44ad);"></div></div></td>
                </tr>
                <tr>
                    <td>非洲</td>
                    <td>2</td>
                    <td>0.1%</td>
                    <td><div class="progress-bar"><div class="progress-fill" style="width: 0.1%; background: linear-gradient(90deg, #1abc9c, #16a085);"></div></div></td>
                </tr>
            </table>
        </div>
        
        <div class="footer">
            数据来源: geochain_mini_test.csv | 生成时间: 2026-05-21
        </div>
    </div>
    
    <script>
        var ctx = document.getElementById('continentChart').getContext('2d');
        var chart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['欧洲', '亚洲', '北美洲', '南美洲', '大洋洲', '非洲'],
                datasets: [{
                    data: [
                        1209,
                        206,
                        445,
                        117,
                        120,
                        2
                    ],
                    backgroundColor: [
                        'rgba(52, 152, 219, 0.8)',
                        'rgba(231, 76, 60, 0.8)',
                        'rgba(46, 204, 113, 0.8)',
                        'rgba(243, 156, 18, 0.8)',
                        'rgba(155, 89, 182, 0.8)',
                        'rgba(26, 188, 156, 0.8)'
                    ],
                    borderColor: [
                        'rgba(52, 152, 219, 1)',
                        'rgba(231, 76, 60, 1)',
                        'rgba(46, 204, 113, 1)',
                        'rgba(243, 156, 18, 1)',
                        'rgba(155, 89, 182, 1)',
                        'rgba(26, 188, 156, 1)'
                    ],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            padding: 20,
                            font: { size: 14 }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
